spring.application.name=aplazo-backend-challenge
#db conf
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/bnpl_db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

#logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

#logger
logging.level.root=INFO
logging.level.com.fakebank.abc.api=DEBUG
logging.pattern.console=%d{dd MMMM yyyy HH:mm:ss} %-5level %logger{36} - %msg%n

#security
#spring.security.user.name=admin
#spring.security.user.password=admin123
